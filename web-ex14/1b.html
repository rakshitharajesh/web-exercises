<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Image Display</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Include React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>

    <script type="text/babel">
      function ImageDisplay() {
        return (
          <div>
            <h1>Image from src/images Folder</h1>
            {/* Reference the image from the src/images folder */}
            <img src="./src/images/sample-image.jpg" alt="Sample" style={{ width: '300px', height: 'auto' }} />
          </div>
        );
      }

      ReactDOM.render(<ImageDisplay />, document.getElementById('root'));
    </script>
  </body>
</html>
