<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novell Services Login Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .form-container {
        width: 300px;
        margin: auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      h2 {
        text-align: center;
      }
      .form-group {
        margin: 10px 0;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      input, select {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      fieldset {
        border: 1px solid #ccc;
        padding: 10px;
        margin-bottom: 10px;
      }
      button {
        width: 48%;
        padding: 10px;
        margin: 5px 1%;
        border: none;
        border-radius: 4px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Include React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>

    <script type="text/babel">
      function NovellLoginForm() {
        const [formData, setFormData] = React.useState({
          username: "",
          password: "",
          city: "",
          server: "",
          role: "",
          services: [],
        });

        const handleInputChange = (e) => {
          const { name, value } = e.target;
          setFormData((prev) => ({ ...prev, [name]: value }));
        };

        const handleCheckboxChange = (e) => {
          const { value, checked } = e.target;
          setFormData((prev) => ({
            ...prev,
            services: checked
              ? [...prev.services, value]
              : prev.services.filter((service) => service !== value),
          }));
        };

        const handleReset = () => {
          setFormData({
            username: "",
            password: "",
            city: "",
            server: "",
            role: "",
            services: [],
          });
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          alert(`Logged in as ${formData.username}`);
        };

        return (
          <div className="form-container">
            <h2>Novell Services Login</h2>
            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label>Username:</label>
                <input
                  type="text"
                  name="username"
                  value={formData.username}
                  onChange={handleInputChange}
                />
              </div>

              <div className="form-group">
                <label>Password:</label>
                <input
                  type="password"
                  name="password"
                  value={formData.password}
                  onChange={handleInputChange}
                />
              </div>

              <div className="form-group">
                <label>City of Employment:</label>
                <input
                  type="text"
                  name="city"
                  value={formData.city}
                  onChange={handleInputChange}
                />
              </div>

              <div className="form-group">
                <label>Web Server:</label>
                <select
                  name="server"
                  value={formData.server}
                  onChange={handleInputChange}
                >
                  <option value="">Choose a server</option>
                  <option value="server1">Server 1</option>
                  <option value="server2">Server 2</option>
                </select>
              </div>

              <fieldset>
                <legend>Please specify your role:</legend>
                <div>
                  <input
                    type="radio"
                    name="role"
                    value="Admin"
                    onChange={handleInputChange}
                  />{" "}
                  Admin
                </div>
                <div>
                  <input
                    type="radio"
                    name="role"
                    value="Engineer"
                    onChange={handleInputChange}
                  />{" "}
                  Engineer
                </div>
                <div>
                  <input
                    type="radio"
                    name="role"
                    value="Manager"
                    onChange={handleInputChange}
                  />{" "}
                  Manager
                </div>
                <div>
                  <input
                    type="radio"
                    name="role"
                    value="Guest"
                    onChange={handleInputChange}
                  />{" "}
                  Guest
                </div>
              </fieldset>

              <fieldset>
                <legend>Single Sign-on to the following:</legend>
                <div>
                  <input
                    type="checkbox"
                    value="Mail"
                    onChange={handleCheckboxChange}
                  />{" "}
                  Mail
                </div>
                <div>
                  <input
                    type="checkbox"
                    value="Payroll"
                    onChange={handleCheckboxChange}
                  />{" "}
                  Payroll
                </div>
                <div>
                  <input
                    type="checkbox"
                    value="Self-service"
                    onChange={handleCheckboxChange}
                  />{" "}
                  Self-service
                </div>
              </fieldset>

              <div>
                <button type="submit">Login</button>
                <button type="button" onClick={handleReset}>
                  Reset
                </button>
              </div>
            </form>
          </div>
        );
      }

      ReactDOM.render(<NovellLoginForm />, document.getElementById("root"));
    </script>
  </body>
</html>
