<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Prime Number Checker</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Include React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>

    <script type="text/babel">
      function PrimeChecker() {
        const [number, setNumber] = React.useState(''); // State to store user input
        const [result, setResult] = React.useState('');  // State to store the result

        // Function to check if a number is prime
        function isPrime(num) {
          if (num <= 1) return false; // Numbers <= 1 are not prime
          for (let i = 2; i <= Math.sqrt(num); i++) {
            if (num % i === 0) {
              return false; // If divisible by any number other than 1 and itself, not prime
            }
          }
          return true;
        }

        // Handle form submission
        function handleSubmit(event) {
          event.preventDefault(); // Prevent page refresh
          const num = parseInt(number); // Convert input to a number
          if (isNaN(num)) {
            setResult('Please enter a valid number.');
          } else {
            setResult(isPrime(num) ? `${num} is a prime number.` : `${num} is not a prime number.`);
          }
        }

        return (
          <div>
            <h1>Prime Number Checker</h1>
            <form onSubmit={handleSubmit}>
              <label>
                Enter a number:
                <input
                  type="number"
                  value={number}
                  onChange={(e) => setNumber(e.target.value)} // Update state on input change
                />
              </label>
              <button type="submit">Check</button>
            </form>
            <p>{result}</p> {/* Display the result */}
          </div>
        );
      }

      // Render the PrimeChecker component inside the #root div
      ReactDOM.render(<PrimeChecker />, document.getElementById('root'));
    </script>
  </body>
</html>
