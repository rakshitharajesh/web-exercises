<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Inline CSS Example</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Include React, ReactDOM, and Babel via CDN -->
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>

    <script type="text/babel">
      function StyledMessage() {
        // Define inline CSS styles as an object
        const messageStyle = {
          color: 'white',
          backgroundColor: '#007BFF',
          padding: '20px',
          borderRadius: '8px',
          textAlign: 'center',
          fontFamily: 'Arial, sans-serif',
          fontSize: '24px'
        };

        return (
          <div style={messageStyle}>
            Hello, React! this is a sample styled message using inline CSS in JSX!
          </div>
        );
      }

      // Render the StyledMessage component inside the #root div
      ReactDOM.render(<StyledMessage />, document.getElementById('root'));
    </script>
  </body>
</html>
