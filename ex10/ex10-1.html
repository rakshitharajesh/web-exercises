<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hospital Patient Data Analytics</title>
  <style> 
    table {
      border-collapse: collapse;
      width: 50%;
      margin-bottom: 20px;
    }
    tr, td, th {
      border: 1px solid #333;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Hospital Patient Data Analytics</h1>
  <div class="section">
    <h2>Sorted Patients (Descending by Age)</h2>
    <table id="sortedTable">
      <tr>
        <th>P-Id</th>
        <th>Name</th>
        <th>Age</th>
      </tr>
      <!-- sorted data rows will be appended here -->
    </table>
  </div>

  <div class="section">
    <h2>Check if a Particular P-Id is Present</h2>
    <input type="number" id="pIdInput" placeholder="Enter P-Id" />
    <button onclick="searchPId()">Search</button>
    <p id="searchResult"></p>
  </div>

  <div class="section">
    <h2>Filter Patients by Age Range</h2>
    <label for="minAge">Min Age: </label>
    <input type="number" id="minAge" placeholder="Min Age" />
    <label for="maxAge">Max Age: </label>
    <input type="number" id="maxAge" placeholder="Max Age" />
    <button onclick="filterByAge()">Filter</button>
    <table id="filteredTable">
      <tr>
        <th>P-Id</th>
        <th>Name</th>
        <th>Age</th>
      </tr>
    </table>
  </div>

  <script>
    const patients = [
      { PId: 1, Name: "Alen",   Age: 39 },
      { PId: 2, Name: "Deena",  Age: 47 },
      { PId: 3, Name: "Diana",  Age: 21 },
      { PId: 4, Name: "Jack",   Age: 54 },
      { PId: 5, Name: "Jain",   Age: 23 },
      { PId: 6, Name: "Kelvin", Age: 61 },
      { PId: 7, Name: "Louis",  Age: 69 },
      { PId: 8, Name: "Rex",    Age: 49 }
    ];

    function sortPatientsDescending(patientArray) {
      return [...patientArray].sort((a, b) => b.Age - a.Age);
    }

    function checkPIdExists(patientArray, searchPId) {
      return patientArray.some(patient => patient.PId === searchPId);
    }

    function filterPatientsByAgeRange(patientArray, minAge, maxAge) {
      return patientArray.filter(patient => patient.Age >= minAge && patient.Age <= maxAge);
    }


    function displayTable(tableId, data) {
      
      const table = document.getElementById(tableId);

      while (table.rows.length > 1) {
        table.deleteRow(1);
      }
      data.forEach(patient => {
        const row = table.insertRow();
        row.insertCell(0).textContent = patient.PId;
        row.insertCell(1).textContent = patient.Name;
        row.insertCell(2).textContent = patient.Age;
      });
    }

    const sortedPatients = sortPatientsDescending(patients);
    displayTable("sortedTable", sortedPatients);

    function searchPId() {
      const pIdInput = document.getElementById("pIdInput").value;
      const searchResult = document.getElementById("searchResult");
      if (pIdInput === "") {
        searchResult.textContent = "Please enter a P-Id to search.";
        return;
      }
      if (checkPIdExists(patients, Number(pIdInput))) {
        searchResult.textContent = `P-Id ${pIdInput} is present in the list.`;
      } else {
        searchResult.textContent = `P-Id ${pIdInput} is NOT present in the list.`;
      }
    }

    function filterByAge() {
      const minAgeValue = document.getElementById("minAge").value;
      const maxAgeValue = document.getElementById("maxAge").value;
      if (minAgeValue === "" || maxAgeValue === "") {
        alert("Please enter both minimum and maximum age values.");
        return;
      }
      const minAge = Number(minAgeValue);
      const maxAge = Number(maxAgeValue);
      const filteredPatients = filterPatientsByAgeRange(patients, minAge, maxAge);
      displayTable("filteredTable", filteredPatients);
    }
  </script>
</body>
</html>
