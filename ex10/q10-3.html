<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Grocery Order Form</title>
  <style>
    .container {
      background: #a6a86c;
      border-radius: 8px;
      max-width: 400px;
      margin: auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 6px;
      margin-top: 5px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .products {
      margin-top: 20px;
    }
    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0;
    }
    .product-item span {
      margin-right: 10px;
    }
    button {
      background: #b57a22;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      width: 100px;
    }
    button:hover {
      background: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Grocery Order Form</h1>
    <form action="receipt.html" method="GET">
      <label>Customer Name</label>
      <input type="text" name="customerName" required>

      <label>Phone Number</label>
      <input type="tel" name="phoneNumber" required>

      <label>Email</label>
      <input type = "email" name = "email" required>

      <div class="products">
        <h2>Products</h2>

        <div class="product-item">
            <img src = "./apple.webp" style = "float: left;height : 100px; width: 100px;border-radius: 50%;">
            <input type = "checkbox">
          <span>Apple</span>
          <span>(₹10)</span>
          <input type="number" name="appleQty" min="0" placeholder="kg" style = "height: 20px;width:100px;">
        </div>

        <div class="product-item">
            <img src = "./banana.webp" style = "float: left;height : 100px; width: 100px;border-radius: 50%;">
            <input type = "checkbox">
          <span>Banana</span>
          <span>(₹5)</span>
          <input type="number" name="bananaQty" min="0" placeholder="kg" style = "height: 20px;width:100px;">
        </div>

        <div class="product-item">
            <img src = "./avocado.jpeg" style = "float: left;height : 100px; width: 100px;border-radius: 50%;">
            <input type = "checkbox">
          <span>Avocado </span>
          <span>(₹7)</span>
          <input type="number" name="avocadoQty" min="0" placeholder="kg" style = "height: 20px;width:100px;">
        </div>
      </div>

      <button type="submit">SUBMIT</button>
    </form>
  </div>
</body>
</html>
